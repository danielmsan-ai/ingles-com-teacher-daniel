<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Practice - Criar Conta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Bem-vindo ao English Practice!</h1>
    </header>
    <main>
        <section id="login-section">
            <h2>Criar Conta</h2>
            <form id="cadastro-form">
                <div class="input-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                <div class="input-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="input-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required minlength="6">
                </div>
                <button type="submit">Criar Conta</button>
            </form>
            <p id="cadastro-message" class="error-message"></p>
            <p style="margin-top: 20px;">
                <a href="index.html">Já tenho conta, voltar ao login</a>
            </p>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 English Practice. Todos os direitos reservados.</p>
    </footer>
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="cadastro.js"></script>
</body>
</html>
