<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Verb Tenses</title>
  <style>

    /* ============================================================
       RESET E BASE
    ============================================================ */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
      color: #333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ============================================================
       TELAS
    ============================================================ */

    .screen {
      display: none;
      width: 100%;
      max-width: 640px;
      padding: 20px;
    }

    .screen.active {
      display: block;
    }

    /* ============================================================
       CARD
    ============================================================ */

    .card {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    /* ============================================================
       TIPOGRAFIA
    ============================================================ */

    h1 {
      font-size: 1.8rem;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 1.4rem;
      color: #1a1a2e;
      margin-bottom: 16px;
    }

    h3 {
      font-size: 1.1rem;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    p {
      font-size: 1rem;
      color: #555;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    /* ============================================================
       INPUTS
    ============================================================ */

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.2s;
      outline: none;
    }

    .input-group input:focus {
      border-color: #4f46e5;
    }

    /* ============================================================
       BOTÕES
    ============================================================ */

    .btn {
      display: inline-block;
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: #4f46e5;
      color: #ffffff;
      width: 100%;
    }

    .btn-primary:hover {
      background-color: #4338ca;
    }

    .btn-secondary {
      background-color: #e5e7eb;
      color: #333;
    }

    .btn-secondary:hover {
      background-color: #d1d5db;
    }

    .btn-danger {
      background-color: #ef4444;
      color: #ffffff;
      padding: 6px 14px;
      font-size: 0.85rem;
    }

    .btn-danger:hover {
      background-color: #dc2626;
    }

    .btn-success {
      background-color: #10b981;
      color: #ffffff;
    }

    .btn-success:hover {
      background-color: #059669;
    }

    .btn-outline {
      background-color: transparent;
      border: 2px solid #4f46e5;
      color: #4f46e5;
    }

    .btn-outline:hover {
      background-color: #4f46e5;
      color: #ffffff;
    }

    /* ============================================================
       TELA DE LOGIN
    ============================================================ */

    #login-screen .card {
      text-align: center;
    }

    #login-screen h1 {
      margin-bottom: 4px;
    }

    #login-screen .subtitle {
      font-size: 0.95rem;
      color: #888;
      margin-bottom: 32px;
    }

    /* ============================================================
       TELA DO PROFESSOR
    ============================================================ */

    .teacher-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .section-divider {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 24px 0;
    }

    .add-student-form {
      margin-bottom: 24px;
    }

    .student-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background-color: #f9fafb;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid #e5e7eb;
    }

    .student-card span {
      font-size: 0.95rem;
      color: #444;
    }

    .teacher-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    /* ============================================================
       TELA DO ALUNO — MÓDULOS
    ============================================================ */

    .student-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    #student-welcome {
      font-size: 1rem;
      color: #555;
      margin-bottom: 24px;
    }

    .modules-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .module-btn {
      background-color: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 24px 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s, transform 0.1s;
      line-height: 1.4;
    }

    .module-btn:hover {
      background-color: #4338ca;
    }

    .module-btn:active {
      transform: scale(0.97);
    }

    .module-btn.green {
      background-color: #10b981;
    }

    .module-btn.green:hover {
      background-color: #059669;
    }

    .module-btn.orange {
      background-color: #f59e0b;
    }

    .module-btn.orange:hover {
      background-color: #d97706;
    }

    .module-btn.red {
      background-color: #ef4444;
    }

    .module-btn.red:hover {
      background-color: #dc2626;
    }

    /* ============================================================
       TELA DO QUIZ
    ============================================================ */

    .quiz-header {
      margin-bottom: 20px;
    }

    .quiz-header h2 {
      margin-bottom: 4px;
    }

    #quiz-progress {
      font-size: 0.9rem;
      color: #888;
    }

    .rule-box {
      background-color: #eef2ff;
      border-left: 4px solid #4f46e5;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: #3730a3;
      line-height: 1.5;
    }

    .question-text {
      font-size: 1.15rem;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .option-btn {
      background-color: #f9fafb;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .option-btn:hover:not(:disabled) {
      border-color: #4f46e5;
      background-color: #eef2ff;
    }

    .option-btn.correct {
      border-color: #10b981;
      background-color: #d1fae5;
      color: #065f46;
    }

    .option-btn.incorrect {
      border-color: #ef4444;
      background-color: #fee2e2;
      color: #991b1b;
    }

    .option-btn:disabled {
      cursor: not-allowed;
    }

    /* ============================================================
       FEEDBACK
    ============================================================ */

    .feedback {
      font-size: 0.95rem;
      line-height: 1.6;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      min-height: 20px;
    }

    .feedback.correct {
      background-color: #d1fae5;
      color: #065f46;
    }

    .feedback.incorrect {
      background-color: #fee2e2;
      color: #991b1b;
    }

    /* ============================================================
       TELA DE RESULTADO
    ============================================================ */

    #result-screen .card {
      text-align: center;
    }

    .result-score {
      font-size: 1.2rem;
      font-weight: 600;
      color: #4f46e5;
      margin: 16px 0 8px;
    }

    .result-message {
      font-size: 1rem;
      color: #555;
      margin-bottom: 32px;
    }

    .result-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ============================================================
       TELA DE RESULTADOS DO PROFESSOR
    ============================================================ */

    .student-results {
      margin-bottom: 24px;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px;
      background-color: #f9fafb;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #444;
      border: 1px solid #e5e7eb;
    }

    /* ============================================================
       RESPONSIVO
    ============================================================ */

    @media (max-width: 480px) {
      .card {
        padding: 24px 20px;
      }

      .modules-grid {
        grid-template-columns: 1fr;
      }

      .teacher-actions {
        flex-direction: column;
      }

      .result-actions {
        flex-direction: column;
      }
    }

  </style>
</head>
<body>

  <!-- ============================================================
       TELA DE LOGIN
  ============================================================ -->
  <div id="login-screen" class="screen active">
    <div class="card">
      <h1>English Verb Tenses</h1>
      <p class="subtitle">Faça login para continuar</p>

      <div class="input-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="seu@email.com" />
      </div>

      <div class="input-group">
        <label for="login-password">Senha</label>
        <input type="password" id="login-password" placeholder="••••••" />
      </div>

      <button class="btn btn-primary" id="login-btn">Entrar</button>
    </div>
  </div>

  <!-- ============================================================
       TELA DO PROFESSOR
  ============================================================ -->
  <div id="teacher-screen" class="screen">
    <div class="card">

      <div class="teacher-header">
        <h2>Painel do Professor</h2>
        <button class="btn btn-secondary" id="logout-teacher-btn">Sair</button>
      </div>

      <h3>Cadastrar novo aluno</h3>
      <div class="add-student-form">
        <div class="input-group">
          <label for="student-name">Nome</label>
          <input type="text" id="student-name" placeholder="Nome do aluno" />
        </div>
        <div class="input-group">
          <label for="student-email">Email</label>
          <input type="email" id="student-email" placeholder="email@aluno.com" />
        </div>
        <div class="input-group">
          <label for="student-password">Senha</label>
          <input type="password" id="student-password" placeholder="Crie uma senha" />
        </div>
        <button class="btn btn-primary" id="add-student-btn">Cadastrar aluno</button>
      </div>

      <hr class="section-divider" />

      <h3>Alunos cadastrados</h3>
      <div id="student-list"></div>

      <div class="teacher-actions">
        <button class="btn btn-outline" id="view-results-btn">Ver resultados</button>
      </div>

    </div>
  </div>

  <!-- ============================================================
       TELA DO ALUNO — MÓDULOS
  ============================================================ -->
  <div id="student-screen" class="screen">
    <div class="card">

      <div class="student-header">
        <h2>English Verb Tenses</h2>
        <button class="btn btn-secondary" id="logout-student-btn">Sair</button>
      </div>

      <p id="student-welcome"></p>

      <div class="modules-grid">
        <button class="module-btn" id="btn-simplePast">Simple Past</button>
        <button class="module-btn green" id="btn-presentPerfect">Present Perfect</button>
        <button class="module-btn orange" id="btn-presentPerfectContinuous">Present Perfect Continuous</button>
        <button class="module-btn red" id="btn-simplePresent">Simple Present</button>
      </div>

    </div>
  </div>

  <!-- ============================================================
       TELA DO QUIZ
  ============================================================ -->
  <div id="quiz-screen" class="screen">
    <div class="card">

      <div class="quiz-header">
        <h2 id="quiz-module-title"></h2>
        <span id="quiz-progress"></span>
      </div>

      <div class="rule-box" id="quiz-rule"></div>

      <p class="question-text" id="quiz-question"></p>

      <div class="options-container" id="quiz-options"></div>

      <div class="feedback" id="quiz-feedback"></div>

      <button class="btn btn-primary" id="next-btn" style="display:none;">
        Próxima questão
      </button>

    </div>
  </div>

  <!-- ============================================================
       TELA DE RESULTADO
  ============================================================ -->
  <div id="result-screen" class="screen">
    <div class="card">

      <h2 id="result-module-title"></h2>
      <p class="result-score" id="result-score"></p>
      <p class="result-message" id="result-message"></p>

      <div class="result-actions">
        <button class="btn btn-primary" id="retry-btn">Tentar novamente</button>
        <button class="btn btn-secondary" id="back-btn">Voltar aos módulos</button>
      </div>

    </div>
  </div>

  <!-- ============================================================
       TELA DE RESULTADOS DO PROFESSOR
  ============================================================ -->
  <div id="results-screen" class="screen">
    <div class="card">

      <div class="teacher-header">
        <h2>Resultados dos alunos</h2>
        <button class="btn btn-secondary" id="back-teacher-btn">Voltar</button>
      </div>

      <div id="results-list"></div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
